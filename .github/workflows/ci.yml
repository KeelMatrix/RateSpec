name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Restore tests and library
        shell: pwsh
        run: >-
          dotnet restore
          tests/KeelMatrix.RateSpec.Tests/KeelMatrix.RateSpec.Tests.csproj
          --configfile NuGet.config
          --packages "${{ runner.temp }}/nuget-packages"

      - name: Build tests and library
        shell: pwsh
        run: >-
          dotnet build
          tests/KeelMatrix.RateSpec.Tests/KeelMatrix.RateSpec.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run tests
        shell: pwsh
        run: >-
          dotnet test
          tests/KeelMatrix.RateSpec.Tests/KeelMatrix.RateSpec.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Verify formatting
        shell: pwsh
        run: |
          dotnet format src/KeelMatrix.RateSpec/KeelMatrix.RateSpec.csproj --verify-no-changes --no-restore
          dotnet format tests/KeelMatrix.RateSpec.Tests/KeelMatrix.RateSpec.Tests.csproj --verify-no-changes --no-restore

      - name: Test release validator
        shell: pwsh
        run: pwsh ./tests/Validate-Release.Tests.ps1

      - name: Test release-facing text hygiene
        shell: pwsh
        run: pwsh ./tests/Validate-TextHygiene.Tests.ps1

      - name: Test reachable commit message policy
        shell: pwsh
        run: pwsh ./scripts/Verify-CommitMessages.ps1 -SelfTest

      - name: Test package restore identity validator
        shell: pwsh
        run: pwsh ./tests/Validate-PackageRestore.Tests.ps1

      - name: Test vulnerability audit parser
        shell: pwsh
        run: pwsh ./tests/Validate-VulnerabilityAudit.Tests.ps1

  package:
    name: Package, archive, and consumer gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Restore shipping project
        shell: pwsh
        run: >-
          dotnet restore
          src/KeelMatrix.RateSpec/KeelMatrix.RateSpec.csproj
          --configfile NuGet.config
          --packages "${{ runner.temp }}/nuget-packages"

      - name: Build package
        shell: pwsh
        run: >-
          dotnet pack
          src/KeelMatrix.RateSpec/KeelMatrix.RateSpec.csproj
          --configuration Release
          --no-restore
          --output artifacts/package

      - name: Inspect package archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath artifacts/package -File | Where-Object { $_.Name -match '^KeelMatrix\.RateSpec\..+\.nupkg$' -and $_.Name -notmatch '\.snupkg$' })
          $symbols = @(Get-ChildItem -LiteralPath artifacts/package -File | Where-Object { $_.Name -match '^KeelMatrix\.RateSpec\..+\.snupkg$' })
          if ($packages.Count -ne 1 -or $symbols.Count -ne 1) {
              throw "Expected exactly one .nupkg and one .snupkg; found $($packages.Count) and $($symbols.Count)."
          }

          & pwsh ./scripts/Validate-PackageArchive.ps1 -PackagePath $packages[0].FullName -SymbolPackagePath $symbols[0].FullName -AllowMissingIcon
          & pwsh ./tests/Validate-PackageArchive.Tests.ps1 -PackagePath $packages[0].FullName -SymbolPackagePath $symbols[0].FullName

      - name: Audit package dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $auditOutput = @(
              & dotnet list `
                  src/KeelMatrix.RateSpec/KeelMatrix.RateSpec.csproj `
                  package `
                  --vulnerable `
                  --include-transitive `
                  --format json `
                  --output-version 1 `
                  --configfile NuGet.config 2>&1
          )
          $exitCode = $LASTEXITCODE
          $auditText = $auditOutput | ForEach-Object { $_.ToString() } | Out-String
          Write-Output $auditText

          if ($exitCode -ne 0) {
              throw "The vulnerability audit command failed with exit code $exitCode."
          }

          if ([string]::IsNullOrWhiteSpace($auditText)) {
              throw 'The vulnerability audit produced no report; failing closed.'
          }
          & pwsh -NoProfile -File ./scripts/Validate-VulnerabilityAudit.ps1 -ReportJson $auditText
          if ($LASTEXITCODE -ne 0) {
              throw "The vulnerability audit parser failed with exit code $LASTEXITCODE."
          }

      - name: Restore package consumer
        shell: pwsh
        run: >-
          dotnet restore
          smoke/RateSpec.ConsumerSmoke/RateSpec.ConsumerSmoke.csproj
          --configfile smoke/NuGet.config
          --packages "${{ runner.temp }}/ratespec-smoke-packages-${{ github.run_id }}-${{ github.run_attempt }}"
          --no-cache
          --force

      - name: Verify package consumer resolved the produced archive
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/package -File | Where-Object { $_.Name -match '^KeelMatrix\.RateSpec\..+\.nupkg$' -and $_.Name -notmatch '\.snupkg$' })
          if ($packages.Count -ne 1) {
              throw "Expected exactly one produced package; found $($packages.Count)."
          }
          & pwsh ./scripts/Validate-PackageRestore.ps1 `
              -PackagePath $packages[0].FullName `
              -AssetsFile smoke/RateSpec.ConsumerSmoke/obj/project.assets.json
          if ($LASTEXITCODE -ne 0) {
              throw "The package restore identity validator failed with exit code $LASTEXITCODE."
          }

      - name: Build package consumer
        shell: pwsh
        run: >-
          dotnet build
          smoke/RateSpec.ConsumerSmoke/RateSpec.ConsumerSmoke.csproj
          --configuration Release
          --no-restore

      - name: Run package consumer smoke test
        shell: pwsh
        run: >-
          dotnet run
          --project smoke/RateSpec.ConsumerSmoke/RateSpec.ConsumerSmoke.csproj
          --configuration Release
          --no-build
          --no-restore
