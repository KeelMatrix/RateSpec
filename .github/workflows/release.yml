name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  publish:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Validate release metadata
        shell: pwsh
        run: pwsh ./scripts/Validate-Release.ps1 -Tag $env:RELEASE_TAG

      - name: Run repository validation
        shell: pwsh
        run: ./scripts/Validate-Local.ps1

      - name: Inspect exact release artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $expected = @("KeelMatrix.RateSpec.$version.nupkg", "KeelMatrix.RateSpec.$version.snupkg")
          $files = @(Get-ChildItem -LiteralPath artifacts/package -File)
          if ($files.Count -ne 2 -or @($files | Where-Object Name -cnotin $expected).Count -ne 0) {
              throw "Expected exactly $($expected -join ' and ')."
          }
          & pwsh ./scripts/Validate-PackageArchive.ps1 -PackagePath "artifacts/package/$($expected[0])" -SymbolPackagePath "artifacts/package/$($expected[1])"
          if ($LASTEXITCODE -ne 0) { throw 'Paired release archive validation failed.' }

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet nuget push "artifacts/package/KeelMatrix.RateSpec.$version.nupkg" --no-symbols --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Package publication failed.' }
          dotnet nuget push "artifacts/package/KeelMatrix.RateSpec.$version.snupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Symbol publication failed.' }
